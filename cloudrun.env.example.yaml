# Settings for Google Cloud Run. Copy to "cloudrun.env.yaml" (never share or commit that file)
# and fill in your values. Use the SAME Supabase Session pooler string for both URLs.
DATABASE_URL: "postgresql://postgres.YOUR_PROJECT_REF:YOUR_DB_PASSWORD@aws-1-ap-south-1.pooler.supabase.com:5432/postgres"
DIRECT_URL: "postgresql://postgres.YOUR_PROJECT_REF:YOUR_DB_PASSWORD@aws-1-ap-south-1.pooler.supabase.com:5432/postgres"
APP_TIMEZONE: "Asia/Kolkata"
DEFAULT_COUNTRY_CODE: "91"
SESSION_DAYS: "30"
# Already set inside the container image: NODE_ENV=production, HOST=0.0.0.0, TRUST_PROXY=1, COOKIE_SECURE=true
